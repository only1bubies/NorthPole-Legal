kind = "web"
previewPath = "/"
title = "NorthPole Solicitors"
version = "1.0.0"
id = "artifacts/northpole-solicitors"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25593

[services.development]
run = "pnpm --filter @workspace/northpole-solicitors run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/northpole-solicitors", "run", "build" ]
serve = "static"
publicDir = "artifacts/northpole-solicitors/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25593"
BASE_PATH = "/"
